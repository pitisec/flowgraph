# Statyczny FlowGraph. Zastępuje /etc/nginx/conf.d/default.conf w obrazie nginx-unprivileged.

# HTML zawsze sprawdzany (nowa wersja po aktualizacji obrazu), reszta może poczekać godzinę
map $sent_http_content_type $flowgraph_cache {
    ~^text/html "no-cache";
    default     "public, max-age=3600";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Edytor ma skrypty i style w jednym pliku; z zewnątrz pobiera tylko fonty Google.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control $flowgraph_cache always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
