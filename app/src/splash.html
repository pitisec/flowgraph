<!doctype html>
<!-- Ekran startowy aplikacji (tylko Tauri, okno „splash”). Kopiowany do dist/ przez `npm run web`.
     Okno jest zawsze na wierzchu: edytor startuje pod nim normalnie, a ekran sam znika po animacji.
     Motyw z ikony: kółko → trzy ścieżki (niebieska, zielona, pomarańczowa) → kwadrat, rysowane po kolei. -->
<html lang="pl">
<head>
<meta charset="utf-8">
<title>FlowGraph</title>
<script>
  try { var t = localStorage.getItem("flowgraph-theme") || "dark";
    if (t === "auto") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t); } catch (e) { /* ciemny */ }
</script>
<style>
  :root {
    --bg: #0f1419; --panel: #172029; --line: #2c3946; --text: #e4e9ee; --muted: #93a0ad;
    --blue: #6db3ef; --green: #6fcf97; --orange: #f29a4a; --node: #dfe6ed;
  }
  /* motyw jak w edytorze (localStorage „flowgraph-theme”, domyślnie ciemny); „auto” idzie za systemem */
  :root[data-theme="light"] { --bg: #f3f5f7; --panel: #ffffff; --line: #d5dbe2; --text: #17202a; --muted: #5b6774;
    --blue: #1f6fb2; --green: #2e7d4f; --orange: #c2620a; --node: #17202a; }
  :root[data-theme="black"] { --bg: #000000; --panel: #0a0a0a; --line: #262626; --text: #ededed; --muted: #8c8c8c;
    --blue: #7cc0ff; --green: #7ee2a8; --orange: #ffa45c; --node: #ededed; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; cursor: default; user-select: none; -webkit-user-select: none; }
  body { font-family: -apple-system, BlinkMacSystemFont, "IBM Plex Sans", system-ui, sans-serif; color: var(--text); }
  .card {
    box-sizing: border-box; height: 100%; display: grid; place-items: center; align-content: center; gap: 6px;
    background: radial-gradient(120% 90% at 50% 0%, var(--panel), var(--bg));
    border: 1px solid var(--line); border-radius: 18px;
  }
  svg { width: 220px; height: 96px; margin-bottom: 14px; overflow: visible; }
  .node { fill: none; stroke: var(--node); stroke-width: 5; opacity: 0; animation: fade .35s ease-out forwards; }
  .n2 { animation-delay: .75s; }
  .path { fill: none; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 1 2; stroke-dashoffset: 1; animation: draw .7s cubic-bezier(.5, 0, .2, 1) both; }
  .p1 { stroke: var(--blue); animation-delay: .2s; }
  .p2 { stroke: var(--green); animation-delay: .32s; }
  .p3 { stroke: var(--orange); animation-delay: .44s; }
  .dot { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .35s ease-out forwards, pulse 1.6s ease-in-out 1.4s infinite; }
  .d1 { fill: var(--blue); animation-delay: .6s, 1.4s; }
  .d2 { fill: var(--green); animation-delay: .7s, 1.6s; }
  .d3 { fill: var(--orange); animation-delay: .8s, 1.8s; }
  h1 { margin: 0; font-size: 28px; font-weight: 650; letter-spacing: -0.01em; opacity: 0; animation: rise .5s ease-out .5s forwards; }
  p { margin: 0; font-size: 13px; color: var(--muted); opacity: 0; animation: rise .5s ease-out .62s forwards; }
  .ver { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--muted); letter-spacing: .04em; opacity: 0; animation: fade .4s ease-out .9s forwards; }
  @keyframes draw { from { stroke-dashoffset: 1; opacity: 0; } 8% { opacity: 1; } to { stroke-dashoffset: 0; opacity: 1; } }
  @keyframes fade { to { opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: scale(1); } }
  @keyframes pulse { 50% { transform: scale(1.25); } }
  /* koniec: ekran startowy gaśnie nad gotowym już oknem edytora i zamyka się */
  .card { transition: opacity .35s ease-in, transform .35s ease-in; }
  .bye .card { opacity: 0; transform: scale(.97); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<div class="card" data-tauri-drag-region>
  <svg viewBox="0 0 220 96" aria-hidden="true">
    <path class="path p1" pathLength="1" d="M32 48 C 70 48, 86 10, 110 10 S 150 48, 188 48"/>
    <path class="path p3" pathLength="1" d="M32 48 C 70 48, 86 86, 110 86 S 150 48, 188 48"/>
    <path class="path p2" pathLength="1" d="M32 48 H 188"/>
    <circle class="node" cx="18" cy="48" r="15"/>
    <rect class="node n2" x="188" y="33" width="30" height="30" rx="6"/>
    <circle class="dot d1" cx="110" cy="10" r="8"/>
    <circle class="dot d2" cx="110" cy="48" r="8"/>
    <circle class="dot d3" cx="110" cy="86" r="8"/>
  </svg>
  <h1>FlowGraph</h1>
  <p>Edytor diagramów przepływu</p>
  <div class="ver" id="ver"></div>
</div>
<script>
  // wersja z Tauri; bez Tauri (podgląd w przeglądarce) linia zostaje pusta
  // po animacji (ostatni element pojawia się po ~1,3 s) ekran gaśnie i zamyka swoje okno
  setTimeout(() => {
    document.documentElement.classList.add("bye");
    setTimeout(() => window.__TAURI__?.window?.getCurrentWindow().close().catch(() => {}), 380);
  }, 1500);
  window.__TAURI__?.app?.getVersion().then(v => { document.getElementById("ver").textContent = "wersja " + v; }).catch(() => {});
</script>
</body>
</html>
