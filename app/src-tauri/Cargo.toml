[package]
name = "flowgraph"
version = "0.10.5"
license = "MIT"
description = "Edytor diagramów przepływu"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
base64 = "0.23"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
