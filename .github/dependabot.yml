# Cotygodniowe aktualizacje zależności: akcje GitHuba (przypięte do SHA), npm, Cargo i obraz bazowy Dockera.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci # ci(deps): …, zgodnie z Conventional Commits
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    commit-message:
      prefix: build # build(deps): …
      include: scope
    directories: ["/", "/app"]
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: cargo
    commit-message:
      prefix: build # build(deps): …
      include: scope
    directory: /app/src-tauri
    ignore:
      # notify 7+: na macOS aplikacja przestaje przeładowywać plik zmieniony na dysku (sprawdzone z 8.2.1); wymaga zmian w watch_file
      - dependency-name: notify
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    commit-message:
      prefix: build # build(deps): …
      include: scope
    directory: /
    schedule:
      interval: weekly
    ignore:
      # nginx: nieparzysty drugi numer to gałąź mainline; zostajemy na stable (parzysty), poprawki 1.30.x przychodzą dalej
      - dependency-name: nginxinc/nginx-unprivileged
        versions: [">= 1.31, < 1.32", ">= 1.33, < 1.34", ">= 1.35, < 1.36", ">= 1.37, < 1.38", ">= 1.39, < 1.40"]
