# Obraz Dockera w GitHub Container Registry: po opublikowaniu wydania (szkic → „Publish release”)
# buduje obraz z otagowanej wersji dla linux/amd64 i linux/arm64 i wypycha go jako
#   ghcr.io/<właściciel>/flowgraph:X.Y.Z, :X.Y i :latest  (z poświadczeniem pochodzenia).
# Ręczne uruchomienie z gałęzi wypycha tag z nazwą gałęzi (np. :main).
name: Docker

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Obraz
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write # poświadczenie pochodzenia obrazu
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/flowgraph
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=FlowGraph
            org.opencontainers.image.description=Edytor grafów przepływów z YAML w przeglądarce

      # Dockerfile nie ma kroków RUN, więc druga architektura nie wymaga emulacji (QEMU)
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Poświadczenie pochodzenia
        # poświadczenie działa tylko w publicznych repo (na planie Free); w prywatnym, np. testowym, krok jest pomijany
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/flowgraph
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
